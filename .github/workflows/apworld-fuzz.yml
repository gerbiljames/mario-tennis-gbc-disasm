name: Fuzz APWorld
on:
  push:
    branches: [ archipelago ]
    paths: [ "apworld/**", ".github/workflows/apworld-*.yml" ]
  pull_request:
    branches: [ archipelago ]
    paths: [ "apworld/**", ".github/workflows/apworld-*.yml" ]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/fuzz@b20e0a29832ad8296953488b8ae41a6e0795c726 # main as of 2026-10-25
        with:
          apworld-path: apworld/mario_tennis_gbc
          ap-version: '0.6.8'
          python-version: '3.13'
