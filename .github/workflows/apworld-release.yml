name: Release APWorld
on:
  push:
    tags:
      - 'apworld-v*'

# Eijebong/ap-actions' release-apworld workflow, with the repository's LICENSE
# copied into the apworld before it is packaged.
env:
  APWORLD_PATH: apworld/mario_tennis_gbc
  AP_VERSION: '0.6.8'
  PYTHON_VERSION: '3.13'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp LICENSE "${APWORLD_PATH}/LICENSE"
      - uses: Eijebong/ap-actions/package-apworld@b20e0a29832ad8296953488b8ae41a6e0795c726 # main as of 2026-10-25
        id: apworld
        with:
          path: ${{ env.APWORLD_PATH }}
          checkout: false
          ap-version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: apworld
          path: ${{ steps.apworld.outputs.apworld }}

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/generate-template@b20e0a29832ad8296953488b8ae41a6e0795c726 # main as of 2026-10-25
        id: template
        with:
          apworld-path: ${{ env.APWORLD_PATH }}
          ap-version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: template
          path: ${{ steps.template.outputs.template }}

  publish:
    runs-on: ubuntu-latest
    needs: [package, template]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apworld
      - uses: actions/download-artifact@v4
        with:
          name: template
      - id: title
        run: echo "title=Mario Tennis GBC apworld ${GITHUB_REF_NAME#apworld-}" >> "$GITHUB_OUTPUT"
      - uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.title.outputs.title }}
          artifacts: '*'
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          immutableCreate: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
