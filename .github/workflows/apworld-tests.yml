name: Test APWorld
on:
  push:
    branches: [ archipelago ]
    paths: [ "apworld/**", ".github/workflows/apworld-*.yml" ]
  pull_request:
    branches: [ archipelago ]
    paths: [ "apworld/**", ".github/workflows/apworld-*.yml" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Eijebong/ap-actions/setup-ap@b20e0a29832ad8296953488b8ae41a6e0795c726 # main as of 2026-10-25
        with:
          version: '0.6.8'
          python-version: '3.13'

      - uses: Eijebong/ap-actions/copy-apworld-source@b20e0a29832ad8296953488b8ae41a6e0795c726 # main as of 2026-10-25
        with:
          apworld-path: apworld/mario_tennis_gbc

      - name: Run tests
        working-directory: archipelago
        env:
          AP_TEST_WORLDS: mario_tennis_gbc
        run: |
          uv pip install pytest pytest-subtests
          uv run python ModuleUpdate.py --yes --force --append WebHostLib/requirements.txt
          uv run pytest
